<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title & Description base (sobrescrito por react-helmet-async em cada página) -->
    <title>Gpowerhub - Tecnologia Estratégica para Pequenas e Médias Empresas</title>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gpowerhub.com.br/" />
    <meta property="og:title" content="Gpowerhub - Tecnologia Estratégica para PMEs" />

    <meta name="twitter:image" content="https://gpowerhub.com.br/og-image.png" />
